<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de una petición con failover</title>
  <desc id="desc">Diagrama de secuencia entre el ESP8266, el proxy FastAPI, el pool de modelos y OpenRouter. Muestra la consulta, la descarga del catálogo, el primer modelo con 429, el cooldown y el reintento exitoso con un segundo modelo.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172033" stroke-width="1"/>
    </pattern>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="aMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F87171"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/>
    </marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#0B1020"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <text x="48" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Flujo de una petición con failover</text>
  <text x="48" y="86" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94A3B8">Qué ocurre entre pulsar ENTER en el monitor serie y ver la respuesta en pantalla</text>

  <!-- Cajas de participantes -->
  <rect x="40" y="116" width="220" height="60" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="150" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">ESP8266</text>
  <text x="150" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">cliente serie</text>

  <rect x="320" y="116" width="220" height="60" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="430" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">FastAPI</text>
  <text x="430" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">:8001 /api/query</text>

  <rect x="600" y="116" width="220" height="60" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="710" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">ModelsPool</text>
  <text x="710" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">estado en memoria</text>

  <rect x="880" y="116" width="220" height="60" rx="10" fill="#111827" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="990" y="142" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">OpenRouter</text>
  <text x="990" y="162" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">API v1 · HTTPS</text>

  <!-- Líneas de vida -->
  <line x1="150" y1="176" x2="150" y2="752" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="430" y1="176" x2="430" y2="752" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="710" y1="176" x2="710" y2="752" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="990" y1="176" x2="990" y2="752" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- 1 -->
  <line x1="150" y1="240" x2="412" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="280" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">GET /api/query?q=...</text>
  <circle cx="280" cy="240" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="280" y="244" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">1</text>

  <!-- 2 -->
  <line x1="430" y1="286" x2="692" y2="286" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="560" y="268" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">available_models()</text>
  <circle cx="560" cy="286" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="560" y="290" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">2</text>

  <!-- 3 -->
  <line x1="710" y1="332" x2="972" y2="332" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="850" y="314" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">GET /models (caché 6 h)</text>
  <circle cx="850" cy="332" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="850" y="336" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">3</text>

  <!-- 4 -->
  <line x1="990" y1="378" x2="728" y2="378" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aMuted)"/>
  <text x="850" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#94A3B8">catálogo filtrado pricing $0</text>
  <circle cx="850" cy="378" r="10" fill="#0B1020" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="850" y="382" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#94A3B8">4</text>

  <!-- 5 -->
  <line x1="430" y1="424" x2="972" y2="424" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="700" y="406" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">chat_stream(modelo chino #1)</text>
  <circle cx="700" cy="424" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="700" y="428" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">5</text>

  <!-- 6 -->
  <line x1="990" y1="470" x2="448" y2="470" stroke="#F87171" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aRed)"/>
  <text x="720" y="452" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#F87171">429 Too Many Requests</text>
  <circle cx="720" cy="470" r="10" fill="#0B1020" stroke="#F87171" stroke-width="1.5"/>
  <text x="720" y="474" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#F87171">6</text>

  <!-- 7 -->
  <line x1="430" y1="516" x2="692" y2="516" stroke="#F59E0B" stroke-width="2" marker-end="url(#aAmber)"/>
  <text x="560" y="498" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FCD34D">mark_failure(id, 429) → 600 s</text>
  <circle cx="560" cy="516" r="10" fill="#0B1020" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="560" y="520" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">7</text>

  <!-- 8 -->
  <line x1="430" y1="562" x2="972" y2="562" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="700" y="544" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">chat_stream(siguiente candidato)</text>
  <circle cx="700" cy="562" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="700" y="566" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">8</text>

  <!-- 9 -->
  <line x1="990" y1="608" x2="448" y2="608" stroke="#34D399" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aGreen)"/>
  <text x="720" y="590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6EE7B7">200 + deltas SSE</text>
  <circle cx="720" cy="608" r="10" fill="#0B1020" stroke="#34D399" stroke-width="1.5"/>
  <text x="720" y="612" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#6EE7B7">9</text>

  <!-- 10 -->
  <line x1="430" y1="654" x2="692" y2="654" stroke="#38BDF8" stroke-width="2" marker-end="url(#aCyan)"/>
  <text x="560" y="636" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7DD3FC">mark_success(id)</text>
  <circle cx="560" cy="654" r="10" fill="#0B1020" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="560" y="658" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#7DD3FC">10</text>

  <!-- 11 -->
  <line x1="430" y1="700" x2="168" y2="700" stroke="#94A3B8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aMuted)"/>
  <text x="300" y="682" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E5E7EB">JSON: ok, model, text, error</text>
  <circle cx="300" cy="700" r="10" fill="#0B1020" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="300" y="704" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#E5E7EB">11</text>

  <!-- Llave de failover -->
  <path d="M 1120 424 H 1144 V 562 H 1120" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="1160" y="498" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#FCD34D" transform="rotate(90 1160 498)">failover</text>

  <!-- Notas inferiores -->
  <rect x="60" y="778" width="510" height="56" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="78" y="801" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">El proxy acumula todos los deltas SSE y responde una sola vez:</text>
  <text x="78" y="821" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">el ESP8266 nunca ve streaming, solo un JSON pequeño.</text>

  <rect x="600" y="778" width="540" height="56" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="618" y="801" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">Si se agotan los candidatos: RouterError →</text>
  <text x="618" y="821" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#F87171">{&quot;ok&quot;: false, &quot;error&quot;: &quot;detalle de intentos&quot;}</text>

  <text x="1152" y="870" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">proxy-openrouter-ia-chinas</text>
</svg>
