<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Despliegue doméstico del proxy</title>
  <desc id="desc">Topología de red: un router WiFi, una notebook o Raspberry Pi ejecutando el proxy en el puerto 8001, una ESP8266 y un script en la misma LAN, y la salida HTTPS hacia OpenRouter.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172033" stroke-width="1"/>
    </pattern>
    <marker id="dCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="dAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="dViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C2F"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="840" fill="#0B1020"/>
  <rect width="1200" height="840" fill="url(#grid)"/>

  <text x="48" y="56" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Despliegue doméstico</text>
  <text x="48" y="86" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94A3B8">Todo ocurre en la LAN; la única salida es HTTPS hacia OpenRouter</text>

  <!-- Frontera LAN -->
  <rect x="50" y="120" width="780" height="520" rx="20" fill="none" stroke="#334155" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="72" y="150" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FCD34D">LAN de confianza · misma subred</text>

  <!-- Router -->
  <rect x="90" y="200" width="200" height="100" rx="12" fill="url(#box)" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="120" y1="200" x2="112" y2="176" stroke="#94A3B8" stroke-width="2"/>
  <line x1="150" y1="200" x2="158" y2="176" stroke="#94A3B8" stroke-width="2"/>
  <text x="110" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Router WiFi</text>
  <text x="110" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">SSID 2.4 GHz + 5 GHz</text>
  <text x="110" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">DHCP · puerta de enlace</text>

  <!-- Notebook -->
  <rect x="370" y="170" width="300" height="160" rx="12" fill="url(#box)" stroke="#38BDF8" stroke-width="2"/>
  <rect x="386" y="186" width="268" height="102" rx="6" fill="#0B1220" stroke="#1F2937" stroke-width="1"/>
  <text x="402" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Notebook / Raspberry Pi</text>
  <text x="402" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#38BDF8">proxy FastAPI · :8001</text>
  <text x="402" y="257" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">.env → OPENROUTER_API_KEY</text>
  <text x="402" y="277" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">firewall: solo desde la LAN</text>
  <rect x="386" y="300" width="268" height="14" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>

  <!-- ESP8266 -->
  <rect x="100" y="400" width="230" height="140" rx="12" fill="url(#box)" stroke="#F59E0B" stroke-width="2"/>
  <rect x="118" y="420" width="42" height="26" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="139" y="437" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#94A3B8">ESP-12E</text>
  <text x="178" y="432" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">ESP8266 NodeMCU</text>
  <text x="118" y="472" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">WiFi 2.4 GHz</text>
  <text x="118" y="493" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">serie 115200 · buffer 256</text>
  <text x="118" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FCD34D">GET /api/query</text>

  <!-- Script -->
  <rect x="410" y="510" width="250" height="100" rx="12" fill="url(#box)" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="430" y="542" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">curl / script</text>
  <text x="430" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">GET /api/query?q=...</text>
  <text x="430" y="587" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">misma subred · sin TLS</text>

  <!-- Internet -->
  <rect x="900" y="160" width="250" height="110" rx="12" fill="url(#box)" stroke="#A78BFA" stroke-width="1.5"/>
  <circle cx="925" cy="188" r="10" fill="none" stroke="#A78BFA" stroke-width="1.5"/>
  <ellipse cx="925" cy="188" rx="4.5" ry="10" fill="none" stroke="#A78BFA" stroke-width="1"/>
  <line x1="915" y1="188" x2="935" y2="188" stroke="#A78BFA" stroke-width="1"/>
  <text x="948" y="194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" fill="#E5E7EB">Internet</text>
  <text x="920" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">salida HTTPS 443</text>
  <text x="920" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">sin puertos entrantes</text>

  <!-- OpenRouter -->
  <rect x="890" y="390" width="270" height="160" rx="12" fill="url(#box)" stroke="#A78BFA" stroke-width="2"/>
  <text x="912" y="422" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">openrouter.ai</text>
  <text x="912" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#A78BFA">API v1 · HTTPS</text>
  <line x1="912" y1="462" x2="1138" y2="462" stroke="#1F2937" stroke-width="1"/>
  <text x="912" y="486" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">Catálogo de modelos $0</text>
  <text x="912" y="508" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">Prioridad a modelos chinos</text>
  <text x="912" y="530" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">429 → cooldown automático</text>

  <!-- Flechas LAN -->
  <line x1="290" y1="240" x2="368" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#dCyan)"/>
  <text x="329" y="230" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#7DD3FC">LAN</text>

  <line x1="190" y1="300" x2="190" y2="398" stroke="#F59E0B" stroke-width="2" marker-end="url(#dAmber)"/>
  <text x="200" y="354" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#FCD34D">2.4 GHz</text>

  <path d="M 450 330 L 450 470 L 334 470" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#dCyan)"/>
  <text x="342" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">HTTP :8001</text>

  <line x1="600" y1="330" x2="600" y2="508" stroke="#38BDF8" stroke-width="2" marker-end="url(#dCyan)"/>
  <text x="610" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">HTTP :8001</text>

  <!-- Salida a Internet -->
  <path d="M 670 220 L 840 220 L 840 215 L 898 215" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#dViolet)"/>
  <text x="758" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#C4B5FD">HTTPS 443</text>

  <line x1="1025" y1="270" x2="1025" y2="388" stroke="#A78BFA" stroke-width="2" marker-end="url(#dViolet)"/>

  <!-- Tarjetas de advertencia -->
  <rect x="50" y="690" width="360" height="90" rx="10" fill="#1A1118" stroke="#F87171" stroke-width="1.2"/>
  <text x="70" y="718" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FCA5A5">No exponer a Internet</text>
  <text x="70" y="742" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">8001 es HTTP plano y sin autenticación.</text>
  <text x="70" y="762" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Mantenerlo en la LAN o detrás de una VPN.</text>

  <rect x="430" y="690" width="360" height="90" rx="10" fill="#1A1710" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="450" y="718" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FCD34D">WiFi correcta</text>
  <text x="450" y="742" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">El ESP8266 solo admite 2.4 GHz.</text>
  <text x="450" y="762" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Proxy y placa deben compartir subred.</text>

  <rect x="810" y="690" width="340" height="90" rx="10" fill="#0F1A24" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="830" y="718" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#7DD3FC">Secretos</text>
  <text x="830" y="742" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">La API key vive solo en .env.</text>
  <text x="830" y="762" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#94A3B8">No hardcodear credenciales en el firmware.</text>

  <text x="1152" y="815" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">proxy-openrouter-ia-chinas</text>
</svg>
