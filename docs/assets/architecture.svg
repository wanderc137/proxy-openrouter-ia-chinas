<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura del proxy OpenRouter IA Chinas</title>
  <desc id="desc">Diagrama de bloques: clientes ESP8266 y scripts consultan un proxy FastAPI en el puerto 8001, que usa un pool de modelos gratuitos, un router con prioridad china y un cliente OpenAI para hablar con OpenRouter.</desc>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#172033" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C2F"/>
      <stop offset="100%" stop-color="#0F1626"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A2338"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#0B1020"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <text x="48" y="58" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Arquitectura — Proxy OpenRouter IA Chinas</text>
  <text x="48" y="88" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#94A3B8">Cliente mínimo → proxy local → catálogo de modelos gratuitos con prioridad china</text>

  <!-- ============ CLIENTES ============ -->
  <rect x="40" y="180" width="240" height="120" rx="12" fill="url(#panel)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="212" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">ESP8266 · NodeMCU</text>
  <text x="60" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#94A3B8">WiFi 2.4 GHz</text>
  <text x="60" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#94A3B8">serie 115200 · buffer 256</text>
  <text x="60" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#38BDF8">GET /api/query</text>

  <rect x="40" y="360" width="240" height="120" rx="12" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E5E7EB">curl / scripts / ESP32</text>
  <text x="60" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#94A3B8">HTTP plano</text>
  <text x="60" y="440" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#94A3B8">JSON de 4 campos</text>
  <text x="60" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#38BDF8">misma LAN</text>

  <!-- ============ PROXY ============ -->
  <rect x="340" y="130" width="480" height="540" rx="16" fill="#0D1424" stroke="#38BDF8" stroke-width="2"/>
  <rect x="340" y="130" width="480" height="64" rx="16" fill="#12203A"/>
  <rect x="340" y="170" width="480" height="24" fill="#12203A"/>
  <text x="364" y="160" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#F8FAFC">Proxy local · FastAPI</text>
  <text x="364" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#38BDF8">0.0.0.0:8001</text>
  <rect x="650" y="146" width="146" height="28" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="723" y="165" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#FCD34D">API key en .env</text>

  <rect x="365" y="210" width="430" height="86" rx="10" fill="url(#panel)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="385" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#E5E7EB">GET /api/query</text>
  <text x="385" y="264" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#94A3B8">q: 1–2000 caracteres · key: opcional</text>
  <text x="385" y="284" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#94A3B8">valida, delega a un hilo y serializa JSON</text>

  <rect x="365" y="326" width="430" height="96" rx="10" fill="url(#panel)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="385" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#E5E7EB">FreeModelRouter</text>
  <text x="385" y="379" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#94A3B8">ordena: modelos chinos primero</text>
  <text x="385" y="400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" fill="#94A3B8">failover por modelo · registra intentos</text>

  <rect x="365" y="452" width="200" height="122" rx="10" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <text x="383" y="481" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#E5E7EB">ModelsPool</text>
  <text x="383" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">catálogo pricing = 0</text>
  <text x="383" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">cooldown 300 / 600 s</text>
  <text x="383" y="547" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">lock + merge de estado</text>
  <text x="383" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#38BDF8">refresh 6 h</text>

  <rect x="595" y="452" width="200" height="122" rx="10" fill="url(#panel)" stroke="#334155" stroke-width="1.5"/>
  <text x="613" y="481" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#E5E7EB">OpenRouterClient</text>
  <text x="613" y="505" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">SDK compatible OpenAI</text>
  <text x="613" y="526" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">1 modelo por intento</text>
  <text x="613" y="547" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">stream = true (SSE)</text>
  <text x="613" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#38BDF8">sin streaming al cliente</text>

  <rect x="365" y="606" width="430" height="44" rx="8" fill="#111827" stroke="#1F2937" stroke-width="1"/>
  <text x="580" y="633" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">Estado en memoria · sin base de datos · 1 worker recomendado</text>

  <!-- ============ OPENROUTER ============ -->
  <rect x="880" y="160" width="280" height="480" rx="16" fill="url(#cloud)" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="1020" y="196" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8FAFC">OpenRouter</text>
  <text x="1020" y="219" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#A78BFA">openrouter.ai · API v1</text>

  <line x1="900" y1="238" x2="1140" y2="238" stroke="#1F2937" stroke-width="1"/>

  <text x="900" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E5E7EB">GET /api/v1/models</text>
  <text x="900" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">pricing.prompt == &quot;0&quot;</text>
  <text x="900" y="307" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">pricing.completion == &quot;0&quot;</text>

  <line x1="900" y1="326" x2="1140" y2="326" stroke="#1F2937" stroke-width="1"/>

  <text x="900" y="354" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#E5E7EB">POST /chat/completions</text>
  <text x="900" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">model = uno del pool</text>
  <text x="900" y="395" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94A3B8">stream = true</text>

  <line x1="900" y1="414" x2="1140" y2="414" stroke="#1F2937" stroke-width="1"/>

  <text x="900" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#FCD34D">Modelos gratuitos</text>
  <rect x="900" y="456" width="52" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="926" y="472" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">GLM</text>
  <rect x="960" y="456" width="56" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="988" y="472" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">Qwen</text>
  <rect x="1024" y="456" width="76" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="1062" y="472" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">DeepSeek</text>
  <rect x="900" y="488" width="66" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="933" y="504" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">MiniMax</text>
  <rect x="974" y="488" width="52" height="24" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="1000" y="504" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#FCD34D">Kimi</text>

  <text x="900" y="544" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">Prioridad: chinos primero</text>
  <text x="900" y="568" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">429 → cooldown automático</text>
  <text x="900" y="592" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">catálogo volátil: cambia solo</text>

  <!-- ============ FLECHAS ============ -->
  <line x1="280" y1="240" x2="358" y2="240" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="292" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">GET ?q=</text>

  <path d="M 280 420 L 318 420 L 318 278 L 358 278" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="286" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">GET ?q=</text>

  <path d="M 358 262 L 318 262 L 318 450 L 286 450" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="292" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#94A3B8">JSON 200</text>

  <line x1="580" y1="296" x2="580" y2="324" stroke="#38BDF8" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="590" y="315" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94A3B8">messages</text>

  <path d="M 470 422 L 470 450" fill="none" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="424" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FCD34D">opciones</text>

  <path d="M 700 422 L 700 450" fill="none" stroke="#F59E0B" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="710" y="442" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#FCD34D">stream</text>

  <path d="M 465 574 L 465 596 L 850 596 L 850 540 L 878 540" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="589" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">GET /models (catálogo)</text>

  <line x1="795" y1="512" x2="878" y2="512" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="836" y="503" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#7DD3FC">chat</text>

  <!-- ============ LEYENDA ============ -->
  <line x1="48" y1="742" x2="88" y2="742" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="98" y="747" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">petición / datos</text>

  <line x1="250" y1="742" x2="290" y2="742" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="300" y="747" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">respuesta</text>

  <rect x="424" y="732" width="14" height="14" rx="3" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="446" y="744" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#94A3B8">prioridad china / castigo 429</text>

  <text x="1152" y="747" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#475569">proxy-openrouter-ia-chinas</text>
</svg>
